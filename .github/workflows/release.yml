name: Release

on:
  release:
    types: [published]

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check release tag matches POM version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          from xml.etree import ElementTree

          version = ElementTree.parse("pom.xml").getroot().findtext("{http://maven.apache.org/POM/4.0.0}version")
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match POM version {version!r}")
          PYTHON

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN

      # Maven 3.10 put local repository metadata into the bundle of publishing plugin 0.11.0, and Central
      # rejected it. Plugin 0.12.0 has not published from Maven 3.10 yet, so releases stay on 3.9.16.
      - name: Set up Maven 3.9.16
        run: |
          curl -fsSLo maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  maven.tar.gz" | sha512sum -c
          tar -xzf maven.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"

      # The validate job has run the whole suite on this commit. The tests are not run again here,
      # where the signing key and the Central token are in the environment.
      - name: Publish to Maven Central
        run: mvn -B -V deploy -Prelease -DskipTests -Dgpg.signer=bc -DautoPublish=true -DwaitUntil=PUBLISHED --file pom.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
